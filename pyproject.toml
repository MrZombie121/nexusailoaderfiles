[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
version = "1.0.0"
description = "High-performance neural architecture and training framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "transformers>=4.30.0",
]
