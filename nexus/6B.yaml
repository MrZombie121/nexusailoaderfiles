model:
  vocab_size: 32000
  hidden_size: 4096
  intermediate_size: 11008
  num_layers: 32
  num_heads: 32
  num_key_value_heads: 8  # Включен Grouped Query Attention (GQA) для экономии памяти
  max_position_embeddings: 2048
  dropout: 0.0
  layer_norm_eps: 1e-5
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 0

training:
  batch_size: 1
  gradient_accumulation_steps: 16  # Ускоряет за счет меньшего накопления
  optimizer: "adafactor"
  learning_rate: 2e-4
  weight_decay: 0.01
  max_steps: 40000
  warmup_steps: 1200
  checkpoint_dir: checkpoints
  logging_dir: logs
  seed: 42
  use_mixed_precision: true
  precision_dtype: "bfloat16"
  save_optimizer_state: false
  checkpoint_every_epochs: 1
  gradient_checkpointing: true
  max_seq_length: 512 # Экстремальное снижение контекста для попытки влезть
  tie_word_embeddings: true # Связывание весов эмбеддингов и lm_head (экономит память)
