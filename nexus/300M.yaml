model:
  vocab_size: 32000
  hidden_size: 768
  intermediate_size: 3072
  num_layers: 12
  num_heads: 12
  num_key_value_heads: 4
  max_position_embeddings: 4096 # Можем позволить большой контекст
  dropout: 0.0
  layer_norm_eps: 1e-5
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 0

training:
  batch_size: 32 # Разгоняем батч на максимум под 16GB
  gradient_accumulation_steps: 2 # Эффективный батч = 64
  optimizer: "adafactor"
  learning_rate: 4e-4
  weight_decay: 0.01
  max_steps: 15000
  warmup_steps: 300
  checkpoint_dir: checkpoints
  logging_dir: logs
  seed: 42
  use_mixed_precision: true # Обязательно bfloat16
  precision_dtype: "bfloat16"
  save_optimizer_state: false
  checkpoint_every_epochs: 1
  gradient_checkpointing: false # Отключаем, чтобы училось еще быстрее (памяти хватит и без него)
