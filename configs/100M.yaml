model:
  vocab_size: 32000
  hidden_size: 512
  intermediate_size: 2048
  num_layers: 8
  num_heads: 8
  max_position_embeddings: 2048
  dropout: 0.1
  layer_norm_eps: 1e-5
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 0

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 3e-4
  weight_decay: 0.01
  max_steps: 10000
  warmup_steps: 200
  checkpoint_dir: checkpoints
  logging_dir: logs
  seed: 42
  use_mixed_precision: false
  save_optimizer_state: false
