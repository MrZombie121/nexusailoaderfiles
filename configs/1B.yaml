model:
  vocab_size: 32000
  hidden_size: 1536
  intermediate_size: 6144
  num_layers: 24
  num_heads: 16
  max_position_embeddings: 2048
  dropout: 0.1
  layer_norm_eps: 1e-5
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 0

training:
  batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 2.5e-4
  weight_decay: 0.01
  max_steps: 20000
  warmup_steps: 500
  checkpoint_dir: checkpoints
  logging_dir: logs
  seed: 42
  use_mixed_precision: true
