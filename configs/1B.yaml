model:
  vocab_size: 32000
  hidden_size: 1536
  intermediate_size: 6144
  num_layers: 24
  num_heads: 16
  num_key_value_heads: 4
  max_position_embeddings: 2048
  dropout: 0.0
  layer_norm_eps: 1e-5
  bos_token_id: 1
  eos_token_id: 2
  pad_token_id: 0

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  optimizer: "adafactor"
  learning_rate: 3e-4
  weight_decay: 0.01
  max_steps: 200
  warmup_steps: 15
  checkpoint_dir: checkpoints
  logging_dir: logs
  seed: 42
  use_mixed_precision: true
  precision_dtype: "float16"
  save_optimizer_state: false
  checkpoint_every_epochs: 1
  gradient_checkpointing: true
  compile: true
  max_seq_length: 256
  log_interval: 10
